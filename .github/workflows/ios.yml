name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "看板地址（可选，留空则用仓库变量 NB_SERVER_URL 或 App 内手填）"
        required: false
        default: ""
      refresh_key:
        description: "远程更新密钥（可选，建议放 Secrets：NB_REFRESH_KEY）"
        required: false
        default: ""
  push:
    branches: [main, master]
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  build:
    runs-on: macos-14
    env:
      SERVER_URL: ${{ inputs.server_url || vars.NB_SERVER_URL }}
      REFRESH_KEY: ${{ inputs.refresh_key || secrets.NB_REFRESH_KEY }}
      BASIC_USER: ${{ vars.NB_BASIC_USER }}
      BASIC_PASS: ${{ secrets.NB_BASIC_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject defaults into Config.swift
        run: |
          cd ios/NbTrip
          python3 - << 'EOF'
          import os
          p = "Sources/Shared/Config.swift"
          s = open(p, encoding="utf-8").read()
          for ph, env in [("__NB_SERVER_URL__", "SERVER_URL"),
                          ("__NB_REFRESH_KEY__", "REFRESH_KEY"),
                          ("__NB_BASIC_USER__", "BASIC_USER"),
                          ("__NB_BASIC_PASS__", "BASIC_PASS")]:
              v = os.environ.get(env, "").strip()
              s = s.replace(ph, v)
          open(p, "w", encoding="utf-8").write(s)
          print("Config.swift defaults injected")
          EOF

      - name: Generate Xcode project
        run: cd ios/NbTrip && xcodegen generate

      - name: Build (unsigned archive)
        run: |
          cd ios/NbTrip
          set -o pipefail
          xcodebuild -project NbTrip.xcodeproj \
            -scheme NbTrip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NbTrip.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tail -40

      - name: Package unsigned IPA
        run: |
          cd ios/NbTrip
          mkdir -p Payload
          cp -R build/NbTrip.xcarchive/Products/Applications/NbTrip.app Payload/
          zip -qry NbTrip-unsigned.ipa Payload
          ls -lh NbTrip-unsigned.ipa

      - name: Show embedded extensions
        run: |
          ls ios/NbTrip/Payload/NbTrip.app/PlugIns/ 2>/dev/null || echo "no PlugIns dir!"

      - uses: actions/upload-artifact@v4
        with:
          name: NbTrip-unsigned-ipa
          path: ios/NbTrip/NbTrip-unsigned.ipa
          retention-days: 30
