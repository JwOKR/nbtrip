name: NbTrip

options:
  bundleIdPrefix: com.jia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  groupOrdering:
    - order: [Shared, App, Widget, Resources]

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  NbTrip:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
      - path: Resources
    info:
      path: NbTrip-Info.plist
      properties:
        CFBundleDisplayName: 行程速度
        CFBundleName: NbTrip
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSExceptionDomains: {}
        UIRequiredDeviceCapabilities: [arm64]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: NbTrip.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jia.nbtrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jia.nbtrip
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: NbTripWidget

  NbTripWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    info:
      path: NbTripWidget-Info.plist
      properties:
        CFBundleDisplayName: 行程速度
        CFBundleName: NbTripWidget
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        LSRequiresIPhoneOS: true
    entitlements:
      path: NbTripWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jia.nbtrip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jia.nbtrip.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
